name: lora_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_blue_plus: ^2.3.12
  flutter_map: ^8.3.1
  flutter_map_vector_tiles: ^2.8.1
  pmtiles: ^2.2.0
  latlong2: ^0.10.0
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  battery_plus: ^6.2.3
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

  record: ^7.1.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/Sathya.pmtiles
